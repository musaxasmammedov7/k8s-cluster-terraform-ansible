- name: Generate Admin Kubeconfig file (internal)
  ansible.builtin.shell: |
    KUBECONFIG_FILE="{{ configs_dir }}/admin.kubeconfig"

    kubectl config set-cluster kubernetes-the-hard-way \
      --certificate-authority={{ certs_dir }}/ca.pem \
      --embed-certs=true \
      --server=https://127.0.0.1:6443 \
      --kubeconfig=${KUBECONFIG_FILE}

    kubectl config set-credentials admin \
      --client-certificate={{ certs_dir }}/admin.pem \
      --client-key={{ certs_dir }}/admin-key.pem \
      --embed-certs=true \
      --kubeconfig=${KUBECONFIG_FILE}

    kubectl config set-context default \
      --cluster=kubernetes-the-hard-way \
      --user=admin \
      --kubeconfig=${KUBECONFIG_FILE}

    kubectl config use-context default --kubeconfig=${KUBECONFIG_FILE}
  args:
    creates: "{{ configs_dir }}/admin.kubeconfig"

- name: Generate Encryption Key
  ansible.builtin.shell: head -c 32 /dev/urandom | base64
  register: encryption_key_raw
  changed_when: false

- name: Generate Data Encryption Configuration File
  ansible.builtin.copy:
    dest: "{{ configs_dir }}/encryption-config.yaml"
    mode: '0600'
    content: |
      kind: EncryptionConfiguration
      apiVersion: apiserver.config.k8s.io/v1
      resources:
        - resources:
            - secrets
          providers:
            - aescbc:
                keys:
                  - name: key1
                    secret: {{ encryption_key_raw.stdout }}
            - identity: {}
