---
- name: Ensure certificates directory exists
  ansible.builtin.file:
    path: "{{ certs_dir }}"
    state: directory
    mode: '0755'

- name: Generate Certificate Authority (CA) private key
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ certs_dir }}/ca-key.pem 2048
    creates: "{{ certs_dir }}/ca-key.pem"

- name: Generate CA self-signed certificate
  ansible.builtin.command:
    cmd: openssl req -x509 -new -nodes -key {{ certs_dir }}/ca-key.pem -days 3650 -out {{ certs_dir }}/ca.pem -subj "/CN=KUBERNETES-CA"
    creates: "{{ certs_dir }}/ca.pem"

- name: Generate Admin client key and certificate
  ansible.builtin.shell: |
    if [ ! -f {{ certs_dir }}/admin.pem ]; then
      openssl genrsa -out {{ certs_dir }}/admin-key.pem 2048
      openssl req -new -key {{ certs_dir }}/admin-key.pem -out {{ certs_dir }}/admin.csr -subj "/CN=admin/O=system:masters"
      openssl x509 -req -in {{ certs_dir }}/admin.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/admin.pem -days 1000
    fi
  args:
    creates: "{{ certs_dir }}/admin.pem"

- name: Generate Worker client certificates
  ansible.builtin.shell: |
    NODE="{{ item }}"
    INTERNAL_IP="{{ hostvars[item]['internal_ip'] }}"
    PUBLIC_IP="{{ hostvars[item]['ansible_host'] }}"

    if [ ! -f {{ certs_dir }}/${NODE}.pem ]; then
      openssl genrsa -out {{ certs_dir }}/${NODE}-key.pem 2048

      cat <<EOF > {{ certs_dir }}/${NODE}-openssl.cnf
    [req]
    req_extensions = v3_req
    distinguished_name = req_distinguished_name
    [req_distinguished_name]
    [v3_req]
    basicConstraints = CA:FALSE
    keyUsage = nonRepudiation, digitalSignature, keyEncipherment
    subjectAltName = @alt_names
    [alt_names]
    DNS.1 = ${NODE}
    IP.1 = ${INTERNAL_IP}
    IP.2 = ${PUBLIC_IP}
    EOF

      openssl req -new -key {{ certs_dir }}/${NODE}-key.pem -out {{ certs_dir }}/${NODE}.csr -subj "/CN=system:node:${NODE}/O=system:nodes" -config {{ certs_dir }}/${NODE}-openssl.cnf
      openssl x509 -req -in {{ certs_dir }}/${NODE}.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/${NODE}.pem -days 1000 -extensions v3_req -extfile {{ certs_dir }}/${NODE}-openssl.cnf
    fi
  loop: "{{ groups['workers'] }}"
  args:
    creates: "{{ certs_dir }}/{{ item }}.pem"

- name: Generate kube-controller-manager certificate
  ansible.builtin.shell: |
    if [ ! -f {{ certs_dir }}/kube-controller-manager.pem ]; then
      openssl genrsa -out {{ certs_dir }}/kube-controller-manager-key.pem 2048
      openssl req -new -key {{ certs_dir }}/kube-controller-manager-key.pem -out {{ certs_dir }}/kube-controller-manager.csr -subj "/CN=system:kube-controller-manager/O=system:kube-controller-manager"
      openssl x509 -req -in {{ certs_dir }}/kube-controller-manager.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/kube-controller-manager.pem -days 1000
    fi
  args:
    creates: "{{ certs_dir }}/kube-controller-manager.pem"

- name: Generate kube-proxy certificate
  ansible.builtin.shell: |
    if [ ! -f {{ certs_dir }}/kube-proxy.pem ]; then
      openssl genrsa -out {{ certs_dir }}/kube-proxy-key.pem 2048
      openssl req -new -key {{ certs_dir }}/kube-proxy-key.pem -out {{ certs_dir }}/kube-proxy.csr -subj "/CN=system:kube-proxy/O=system:node-proxier"
      openssl x509 -req -in {{ certs_dir }}/kube-proxy.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/kube-proxy.pem -days 1000
    fi
  args:
    creates: "{{ certs_dir }}/kube-proxy.pem"

- name: Generate kube-scheduler certificate
  ansible.builtin.shell: |
    if [ ! -f {{ certs_dir }}/kube-scheduler.pem ]; then
      openssl genrsa -out {{ certs_dir }}/kube-scheduler-key.pem 2048
      openssl req -new -key {{ certs_dir }}/kube-scheduler-key.pem -out {{ certs_dir }}/kube-scheduler.csr -subj "/CN=system:kube-scheduler/O=system:kube-scheduler"
      openssl x509 -req -in {{ certs_dir }}/kube-scheduler.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/kube-scheduler.pem -days 1000
    fi
  args:
    creates: "{{ certs_dir }}/kube-scheduler.pem"

- name: Generate Kubernetes API Server certificate
  ansible.builtin.shell: |
    CONTROLLER_INTERNAL="{{ hostvars[groups['controllers'][0]]['internal_ip'] }}"
    CONTROLLER_PUBLIC="{{ hostvars[groups['controllers'][0]]['ansible_host'] }}"

    if [ ! -f {{ certs_dir }}/kubernetes.pem ]; then
      openssl genrsa -out {{ certs_dir }}/kubernetes-key.pem 2048

      cat <<EOF > {{ certs_dir }}/kubernetes-openssl.cnf
    [req]
    req_extensions = v3_req
    distinguished_name = req_distinguished_name
    [req_distinguished_name]
    [v3_req]
    basicConstraints = CA:FALSE
    keyUsage = nonRepudiation, digitalSignature, keyEncipherment
    subjectAltName = @alt_names
    [alt_names]
    DNS.1 = kubernetes
    DNS.2 = kubernetes.default
    DNS.3 = kubernetes.default.svc
    DNS.4 = kubernetes.default.svc.cluster.local
    IP.1 = {{ kubernetes_cluster_ip }}
    IP.2 = 127.0.0.1
    IP.3 = ${CONTROLLER_INTERNAL}
    IP.4 = ${CONTROLLER_PUBLIC}
    EOF

      openssl req -new -key {{ certs_dir }}/kubernetes-key.pem -out {{ certs_dir }}/kubernetes.csr -subj "/CN=kubernetes/O=Kubernetes" -config {{ certs_dir }}/kubernetes-openssl.cnf
      openssl x509 -req -in {{ certs_dir }}/kubernetes.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/kubernetes.pem -days 1000 -extensions v3_req -extfile {{ certs_dir }}/kubernetes-openssl.cnf
    fi
  args:
    creates: "{{ certs_dir }}/kubernetes.pem"

- name: Generate service-account key pair
  ansible.builtin.shell: |
    if [ ! -f {{ certs_dir }}/service-account.pem ]; then
      openssl genrsa -out {{ certs_dir }}/service-account-key.pem 2048
      openssl req -new -key {{ certs_dir }}/service-account-key.pem -out {{ certs_dir }}/service-account.csr -subj "/CN=service-accounts/O=Kubernetes"
      openssl x509 -req -in {{ certs_dir }}/service-account.csr -CA {{ certs_dir }}/ca.pem -CAkey {{ certs_dir }}/ca-key.pem -CAcreateserial -out {{ certs_dir }}/service-account.pem -days 1000
    fi
  args:
    creates: "{{ certs_dir }}/service-account.pem"
