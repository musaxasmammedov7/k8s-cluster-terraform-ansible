---
- name: Create etcd configuration and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /etc/etcd
    - /var/lib/etcd

- name: Copy TLS certificates to etcd config directory
  ansible.builtin.copy:
    src: "{{ certs_dir }}/{{ item }}"
    dest: "/etc/etcd/{{ item }}"
    mode: '0600'
  loop:
    - ca.pem
    - kubernetes.pem
    - kubernetes-key.pem

- name: Download and unpack etcd binaries
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-{{ etcd_version }}-linux-amd64/etcd"

- name: Install etcd and etcdctl binaries
  ansible.builtin.copy:
    src: "/tmp/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    mode: '0755'
  loop:
    - etcd
    - etcdctl

- name: Configure etcd systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/etcd.service
    mode: '0644'
    content: |
      [Unit]
      Description=etcd distributed reliable key-value store
      Documentation=https://github.com/etcd-io/etcd
      After=network.target

      [Service]
      Type=notify
      ExecStart=/usr/local/bin/etcd \
        --name {{ inventory_hostname }} \
        --cert-file=/etc/etcd/kubernetes.pem \
        --key-file=/etc/etcd/kubernetes-key.pem \
        --peer-cert-file=/etc/etcd/kubernetes.pem \
        --peer-key-file=/etc/etcd/kubernetes-key.pem \
        --trusted-ca-file=/etc/etcd/ca.pem \
        --peer-trusted-ca-file=/etc/etcd/ca.pem \
        --peer-client-cert-auth \
        --client-cert-auth \
        --initial-advertise-peer-urls https://{{ internal_ip }}:2380 \
        --listen-peer-urls https://{{ internal_ip }}:2380 \
        --listen-client-urls https://{{ internal_ip }}:2379,https://127.0.0.1:2379 \
        --advertise-client-urls https://{{ internal_ip }}:2379 \
        --initial-cluster-token etcd-cluster-0 \
        --initial-cluster {{ inventory_hostname }}=https://{{ internal_ip }}:2380 \
        --initial-cluster-state new \
        --data-dir=/var/lib/etcd
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart etcd

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start etcd service
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true

- name: Verify etcd cluster health
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/etcdctl endpoint health
      --endpoints=https://127.0.0.1:2379
      --cacert=/etc/etcd/ca.pem
      --cert=/etc/etcd/kubernetes.pem
      --key=/etc/etcd/kubernetes-key.pem
  register: etcd_health
  retries: 5
  delay: 3
  until: etcd_health.rc == 0
  changed_when: false
