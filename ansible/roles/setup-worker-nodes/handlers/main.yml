---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system

- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted

- name: Restart kube-proxy
  ansible.builtin.systemd:
    name: kube-proxy
    state: restarted
