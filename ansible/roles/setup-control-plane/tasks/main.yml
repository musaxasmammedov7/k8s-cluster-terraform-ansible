---
- name: Create Kubernetes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/kubernetes/config
    - /var/lib/kubernetes

- name: Copy TLS certificates and encryption config to control plane
  ansible.builtin.copy:
    src: "{{ certs_dir }}/{{ item }}"
    dest: "/var/lib/kubernetes/{{ item }}"
    mode: '0600'
  loop:
    - ca.pem
    - ca-key.pem
    - kubernetes.pem
    - kubernetes-key.pem
    - service-account.pem
    - service-account-key.pem

- name: Copy encryption config
  ansible.builtin.copy:
    src: "{{ configs_dir }}/encryption-config.yaml"
    dest: "/var/lib/kubernetes/encryption-config.yaml"
    mode: '0600'

- name: Copy control plane kubeconfig files
  ansible.builtin.copy:
    src: "{{ configs_dir }}/{{ item }}"
    dest: "/var/lib/kubernetes/{{ item }}"
    mode: '0600'
  loop:
    - admin.kubeconfig
    - kube-controller-manager.kubeconfig
    - kube-scheduler.kubeconfig

- name: Download Kubernetes Control Plane binaries
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ k8s_version }}/bin/linux/amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
  loop:
    - kube-apiserver
    - kube-controller-manager
    - kube-scheduler
    - kubectl

- name: Configure kube-scheduler yaml
  ansible.builtin.copy:
    dest: /etc/kubernetes/config/kube-scheduler.yaml
    mode: '0644'
    content: |
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      clientConnection:
        kubeconfig: "/var/lib/kubernetes/kube-scheduler.kubeconfig"
      leaderElection:
        leaderElect: true

- name: Create kube-apiserver systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kube-apiserver.service
    mode: '0644'
    content: |
      [Unit]
      Description=Kubernetes API Server
      Documentation=https://github.com/kubernetes/kubernetes
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/kube-apiserver \
        --advertise-address={{ internal_ip }} \
        --allow-privileged=true \
        --apiserver-count=1 \
        --audit-log-maxage=30 \
        --audit-log-maxbackup=3 \
        --audit-log-maxsize=100 \
        --audit-log-path=/var/log/audit.log \
        --authorization-mode=Node,RBAC \
        --bind-address=0.0.0.0 \
        --client-ca-file=/var/lib/kubernetes/ca.pem \
        --enable-admission-plugins=NamespaceLifecycle,NodeRestriction,LimitRanger,ServiceAccount,DefaultStorageClass,ResourceQuota \
        --etcd-cafile=/var/lib/kubernetes/ca.pem \
        --etcd-certfile=/var/lib/kubernetes/kubernetes.pem \
        --etcd-keyfile=/var/lib/kubernetes/kubernetes-key.pem \
        --etcd-servers=https://{{ internal_ip }}:2379 \
        --event-ttl=1h \
        --encryption-provider-config=/var/lib/kubernetes/encryption-config.yaml \
        --kubelet-certificate-authority=/var/lib/kubernetes/ca.pem \
        --kubelet-client-certificate=/var/lib/kubernetes/kubernetes.pem \
        --kubelet-client-key=/var/lib/kubernetes/kubernetes-key.pem \
        --service-account-key-file=/var/lib/kubernetes/service-account.pem \
        --service-account-signing-key-file=/var/lib/kubernetes/service-account-key.pem \
        --service-account-issuer=https://{{ internal_ip }}:6443 \
        --service-cluster-ip-range={{ service_cidr }} \
        --service-node-port-range=30000-32767 \
        --tls-cert-file=/var/lib/kubernetes/kubernetes.pem \
        --tls-private-key-file=/var/lib/kubernetes/kubernetes-key.pem \
        --v=2
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Create kube-controller-manager systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kube-controller-manager.service
    mode: '0644'
    content: |
      [Unit]
      Description=Kubernetes Controller Manager
      Documentation=https://github.com/kubernetes/kubernetes
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/kube-controller-manager \
        --bind-address=0.0.0.0 \
        --cluster-cidr={{ cluster_cidr }} \
        --cluster-name=kubernetes \
        --cluster-signing-cert-file=/var/lib/kubernetes/ca.pem \
        --cluster-signing-key-file=/var/lib/kubernetes/ca-key.pem \
        --kubeconfig=/var/lib/kubernetes/kube-controller-manager.kubeconfig \
        --leader-elect=true \
        --root-ca-file=/var/lib/kubernetes/ca.pem \
        --service-account-private-key-file=/var/lib/kubernetes/service-account-key.pem \
        --service-cluster-ip-range={{ service_cidr }} \
        --use-service-account-credentials=true \
        --v=2
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Create kube-scheduler systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/kube-scheduler.service
    mode: '0644'
    content: |
      [Unit]
      Description=Kubernetes Scheduler
      Documentation=https://github.com/kubernetes/kubernetes
      After=network.target

      [Service]
      ExecStart=/usr/local/bin/kube-scheduler \
        --config=/etc/kubernetes/config/kube-scheduler.yaml \
        --v=2
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start and enable Control Plane services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - kube-apiserver
    - kube-controller-manager
    - kube-scheduler

- name: Setup local user kubeconfig
  ansible.builtin.file:
    path: "{{ item }}/.kube"
    state: directory
    mode: '0755'
  loop:
    - /root
    - /home/ubuntu

- name: Install admin kubeconfig for local access
  ansible.builtin.copy:
    src: /var/lib/kubernetes/admin.kubeconfig
    dest: "{{ item }}/.kube/config"
    remote_src: true
    mode: '0600'
  loop:
    - /root
    - /home/ubuntu

- name: Chown kubeconfig for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu

- name: Wait for API server to become responsive
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/var/lib/kubernetes/admin.kubeconfig get componentstatuses
  register: api_check
  retries: 10
  delay: 3
  until: api_check.rc == 0
  changed_when: false

- name: Setup RBAC for Kubelet API access (apiserver-to-kubelet)
  ansible.builtin.shell: |
    cat <<EOF | kubectl --kubeconfig=/var/lib/kubernetes/admin.kubeconfig apply -f -
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      annotations:
        rbac.authorization.kubernetes.io/autoupdate: "true"
      labels:
        kubernetes.io/bootstrapping: rbac-defaults
      name: system:kube-apiserver-to-kubelet
    rules:
      - apiGroups:
          - ""
        resources:
          - nodes/proxy
          - nodes/stats
          - nodes/log
          - nodes/spec
          - nodes/metrics
        verbs:
          - "*"
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: system:kube-apiserver
      namespace: ""
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:kube-apiserver-to-kubelet
    subjects:
      - apiGroup: rbac.authorization.k8s.io
        kind: User
        name: kubernetes
    EOF
  changed_when: false
